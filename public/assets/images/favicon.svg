<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#243B2D"/>
  <!-- Decorative brass accent ring -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#B08A4A" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.6"/>
  <!-- Calabar Traditional Clay Pot in Terracotta -->
  <g transform="translate(12, 16)">
    <!-- Steam wisps -->
    <path d="M12 4 C10 1, 14 0, 12 -3" stroke="#B08A4A" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M20 5 C18 1, 22 0, 20 -4" stroke="#B08A4A" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M28 4 C26 1, 30 0, 28 -3" stroke="#B08A4A" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <!-- Pot rim -->
    <ellipse cx="20" cy="8" rx="17" ry="3.5" fill="#B85333"/>
    <ellipse cx="20" cy="8" rx="15" ry="2.5" fill="#8A3B21"/>
    <!-- Pot body -->
    <path d="M4 10 C3 22, 9 32, 20 32 C31 32, 37 22, 36 10 Z" fill="#A3482A"/>
    <!-- Pot handles -->
    <path d="M4 14 C1 14, 1 20, 5 21" stroke="#8A3B21" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M36 14 C39 14, 39 20, 35 21" stroke="#8A3B21" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Tribal band on pot -->
    <path d="M7 19 Q20 23 33 19" stroke="#B08A4A" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
